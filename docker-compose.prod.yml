# Production overrides for the VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Differences from development: optimized Next.js builds, no source bind mount for
# the UI, API without --reload, restart always. Secrets come from .env on the VPS.
services:
  ui:
    environment:
      UI_MODE: production
      NODE_ENV: production
      WATCHPACK_POLLING: "false"
    volumes: !override
      - ui_website_next:/app/uis/website/.next
      - ui_backoffice_next:/app/uis/backoffice/.next
    restart: always

  api:
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes: !override
      - ./scripts:/app/scripts:ro
      - ./packages:/app/packages:ro
      - api_data:/data
    # Inside the VPS the API is only reached through the UI (service name); not published.
    ports: !reset []
    restart: always
